<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ filename }}</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --surface: #181825;
      --text: #cdd6f4;
      --muted: #6c7086;
      --accent: #89b4fa;
      --green: #a6e3a1;
      --yellow: #f9e2af;
      --red: #f38ba8;
      --code-bg: #313244;
      --border: #313244;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 10px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      user-select: none;
    }

    .filename {
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
    }

    .badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-md   { background: var(--accent); color: var(--surface); }
    .badge-txt  { background: var(--green);  color: var(--surface); }
    .badge-pdf  { background: var(--red);    color: var(--surface); }

    main {
      flex: 1;
      overflow: auto;
      min-height: 0;
    }

    /* ───── Markdown ───── */
    .markdown-body {
      max-width: 820px;
      margin: 0 auto;
      padding: 36px 24px 64px;
      line-height: 1.75;
      font-size: 15px;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4 {
      color: var(--accent);
      margin-top: 1.6em;
      margin-bottom: 0.5em;
      line-height: 1.3;
    }

    .markdown-body h1 {
      font-size: 2em;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.3em;
      margin-top: 0;
    }

    .markdown-body h2 {
      font-size: 1.5em;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.2em;
    }

    .markdown-body h3 { font-size: 1.25em; }
    .markdown-body h4 { font-size: 1em; color: var(--yellow); }

    .markdown-body p  { margin: 0.9em 0; }
    .markdown-body ul,
    .markdown-body ol { padding-left: 1.8em; margin: 0.5em 0; }
    .markdown-body li { margin: 0.3em 0; }

    .markdown-body a {
      color: var(--accent);
      text-decoration: none;
    }
    .markdown-body a:hover { text-decoration: underline; }

    .markdown-body code {
      background: var(--code-bg);
      padding: 0.15em 0.45em;
      border-radius: 4px;
      font-family: "Consolas", "JetBrains Mono", "Fira Code", monospace;
      font-size: 0.9em;
      color: var(--green);
    }

    .markdown-body pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      overflow-x: auto;
      margin: 1em 0;
    }

    .markdown-body pre code {
      background: none;
      padding: 0;
      color: var(--text);
      font-size: 0.875em;
      line-height: 1.6;
    }

    .markdown-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 1.2em 0;
      font-size: 0.95em;
    }

    .markdown-body th,
    .markdown-body td {
      border: 1px solid var(--border);
      padding: 8px 14px;
      text-align: left;
    }

    .markdown-body th {
      background: var(--code-bg);
      font-weight: 600;
      color: var(--accent);
    }

    .markdown-body tr:nth-child(even) { background: rgba(255,255,255,0.03); }

    .markdown-body blockquote {
      border-left: 3px solid var(--accent);
      padding: 4px 0 4px 16px;
      color: var(--muted);
      margin: 1em 0;
      font-style: italic;
    }

    .markdown-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2em 0;
    }

    .markdown-body img {
      max-width: 100%;
      border-radius: 6px;
    }

    /* task list */
    .markdown-body input[type="checkbox"] {
      margin-right: 6px;
      accent-color: var(--accent);
    }

    /* ───── Plain text ───── */
    .text-body {
      padding: 28px 32px;
      font-family: "Consolas", "JetBrains Mono", "Courier New", monospace;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
      tab-size: 4;
    }

    /* ───── PDF ───── */
    .pdf-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: var(--surface);
    }
  </style>
</head>
<body>
  <header>
    <span class="filename">{{ filename }}</span>
    {% if file_type == 'markdown' %}
      <span class="badge badge-md">MD</span>
    {% elif file_type == 'text' %}
      <span class="badge badge-txt">TXT</span>
    {% elif file_type == 'pdf' %}
      <span class="badge badge-pdf">PDF</span>
    {% endif %}
  </header>

  <main>
    {% if file_type == 'pdf' %}
      <iframe class="pdf-frame" src="/raw"></iframe>

    {% elif file_type == 'markdown' %}
      <div class="markdown-body">{{ content | safe }}</div>

    {% elif file_type == 'text' %}
      <pre class="text-body">{{ content }}</pre>

    {% endif %}
  </main>
</body>
</html>
